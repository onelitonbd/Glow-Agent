<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f13">
  <meta name="application-name" content="Glow Agent">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Glow Agent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="72x72" href="/assets/icons/icon-72.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/assets/icons/icon-96.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/assets/icons/icon-512.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/assets/icons/icon-152.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/assets/icons/icon-192.png">
  <meta name="description" content="Library of photos, PDFs and files uploaded to Glow Agent.">
  <script src="/assets/js/theme.js"></script>
  <link rel="stylesheet" href="/assets/css/app.css">
  <title>Library — Glow Agent</title>
  <style>
    .library-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin: 12px 4px 10px;
    }
    .library-search {
      flex: 1 1 180px;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 42px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--surface);
      color: var(--muted);
    }
    .library-search input {
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font: 13px var(--font);
    }
    .library-search input::placeholder { color: var(--quiet); }
    .view-toggle {
      display: flex;
      gap: 2px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--surface);
    }
    .view-toggle button {
      display: grid;
      width: 36px;
      height: 32px;
      place-items: center;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
    }
    .view-toggle button.active {
      background: var(--accent);
      color: var(--accent-ink);
    }
    .filter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0 4px 14px;
    }
    .filter-chips button {
      min-height: 32px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 99px;
      background: var(--surface);
      color: var(--muted);
      font: 600 11px var(--mono);
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .filter-chips button.active {
      border-color: rgba(198,255,107,.4);
      background: var(--accent-wash);
      color: var(--accent);
    }
    .library-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
      gap: 10px;
    }
    .library-card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      transition: border-color .16s ease, transform .16s ease;
    }
    .library-card:hover { border-color: rgba(198,255,107,.35); transform: translateY(-1px); }
    .library-card-preview {
      position: relative;
      aspect-ratio: 1.2;
      overflow: hidden;
      background: var(--surface-soft);
      display: grid;
      place-items: center;
    }
    .library-card-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .library-card-preview .file-icon {
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      border-radius: 12px;
      background: var(--surface-raised);
      color: var(--accent);
    }
    .library-card-preview .file-icon.pdf { background: rgba(255,158,158,.12); color: var(--danger); }
    .library-card-preview .file-icon.doc { background: rgba(169,156,255,.12); color: var(--violet); }
    .library-card-body {
      padding: 10px 11px 11px;
    }
    .library-card-name {
      display: block;
      overflow: hidden;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: -.02em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .library-card-meta {
      display: flex;
      gap: 6px;
      margin-top: 4px;
      color: var(--quiet);
      font: 10px var(--mono);
    }
    .library-card-actions {
      display: flex;
      gap: 4px;
      margin-top: 8px;
    }
    .library-card-actions button, .library-card-actions a {
      flex: 1;
      display: inline-flex;
      min-height: 30px;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-soft);
      color: var(--text-soft);
      font: 600 10.5px var(--mono);
      text-decoration: none;
    }
    .library-card-actions a.primary {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: transparent;
    }
    .library-list {
      display: grid;
      gap: 6px;
    }
    .library-row {
      display: grid;
      grid-template-columns: 40px minmax(0,1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 10px 11px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
    }
    .library-row:hover { border-color: rgba(198,255,107,.3); }
    .library-row-icon {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border-radius: 10px;
      background: var(--surface-soft);
      color: var(--muted);
      overflow: hidden;
    }
    .library-row-icon img { width: 100%; height: 100%; object-fit: cover; }
    .library-row-icon.image { background: var(--accent-wash); color: var(--accent); }
    .library-row-icon.pdf { background: rgba(255,158,158,.12); color: var(--danger); }
    .library-row-icon.doc { background: rgba(169,156,255,.12); color: var(--violet); }
    .library-row-main { min-width: 0; }
    .library-row-name {
      overflow: hidden;
      font-size: 13px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .library-row-sub {
      display: flex;
      gap: 8px;
      margin-top: 2px;
      color: var(--quiet);
      font: 10.5px var(--mono);
    }
    .library-row-actions {
      display: flex;
      gap: 6px;
    }
    .library-row-actions a, .library-row-actions button {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface-soft);
      color: var(--muted);
      text-decoration: none;
    }
    .library-row-actions a:hover { color: var(--accent); border-color: rgba(198,255,107,.4); }
    .library-empty {
      display: grid;
      min-height: 280px;
      place-content: center;
      padding: 24px;
      border: 1px dashed rgba(255,255,255,.15);
      border-radius: 18px;
      background: var(--surface-soft);
      text-align: center;
    }
    .library-empty h3 { margin: 12px 0 6px; font-size: 16px; }
    .library-empty p { max-width: 300px; margin: 0 auto; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .library-stats {
      display: flex;
      gap: 12px;
      margin: 0 4px 12px;
      color: var(--quiet);
      font: 10.5px var(--mono);
    }
    .library-stats b { color: var(--text-soft); }
    .preview-dialog {
      width: min(100%, 560px);
      max-width: 560px;
    }
    .preview-media {
      margin: 12px 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface-soft);
    }
    .preview-media img { display: block; width: 100%; max-height: 60vh; object-fit: contain; background: #0c0e11; }
    .preview-link {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      padding: 10px 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface-soft);
      font: 11px var(--mono);
      word-break: break-all;
    }
    .preview-link a { color: var(--accent); }
    @media (max-width: 360px) {
      .library-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <a class="icon-button" href="/" aria-label="Back to chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
      <h1 class="app-title">Library</h1>
      <div class="header-actions">
        <button class="icon-button" id="uploadBtn" type="button" aria-label="Upload file" title="Upload file"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/><path d="M5 19h14"/></svg></button>
        <a class="icon-button" href="/settings.html" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06-2.2 2.2-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V20.4h-3.1v-.11a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06-2.2-2.2.06-.06A1.7 1.7 0 0 0 6.78 15a1.7 1.7 0 0 0-1.56-1.03h-.11v-3.1h.11A1.7 1.7 0 0 0 6.78 9.84a1.7 1.7 0 0 0-.34-1.87l-.06-.06 2.2-2.2.06.06a1.7 1.7 0 0 0 1.87.34 1.7 1.7 0 0 0 1.03-1.56v-.11h3.1v.11a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06 2.2 2.2-.06.06a1.7 1.7 0 0 0-.34 1.87 1.7 1.7 0 0 0 1.56 1.03h.11v3.1h-.11A1.7 1.7 0 0 0 19.4 15Z"/></svg></a>
      </div>
    </header>

    <section class="intro">
      <p class="eyebrow">Your uploads</p>
      <p>Every photo, PDF and file you send to the AI is saved here with its own link.</p>
    </section>

    <div class="library-toolbar">
      <label class="library-search" aria-label="Search library">
        <svg viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><circle cx="10.7" cy="10.7" r="5.7"/><path d="m15 15 4 4"/></svg>
        <input id="searchInput" type="search" placeholder="Search by name…" autocomplete="off">
      </label>
      <div class="view-toggle" role="group" aria-label="View mode">
        <button id="gridBtn" type="button" class="active" aria-label="Grid view" title="Grid view"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
        <button id="listBtn" type="button" aria-label="List view" title="List view"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      </div>
    </div>

    <div class="filter-chips" role="group" aria-label="Filter by type">
      <button data-filter="all" class="active" type="button">All</button>
      <button data-filter="image" type="button">Photos</button>
      <button data-filter="pdf" type="button">PDFs</button>
      <button data-filter="doc" type="button">Docs</button>
      <button data-filter="file" type="button">Files</button>
    </div>

    <div class="library-stats" id="stats" hidden></div>

    <section aria-live="polite">
      <div id="libraryState"><div class="loading">Loading library</div></div>
    </section>

    <p class="app-footer">GLOW AGENT · LIBRARY</p>
  </main>

  <input type="file" id="fileInput" hidden multiple>

  <dialog class="dialog preview-dialog" id="previewDialog" aria-labelledby="previewTitle">
    <div class="dialog-handle" aria-hidden="true"></div>
    <header class="dialog-head">
      <div>
        <h2 id="previewTitle">File</h2>
        <p class="dialog-kicker" id="previewKicker">PREVIEW</p>
      </div>
      <button class="icon-button" data-close-dialog="previewDialog" type="button" aria-label="Close preview"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18 6-12 12M6 6l12 12"/></svg></button>
    </header>
    <div id="previewMedia" class="preview-media" hidden></div>
    <div class="field"><label>Direct link <span>CLICK TO OPEN</span></label><div class="preview-link"><a id="previewLink" href="#" target="_blank" rel="noopener"></a><button class="icon-button" id="copyLinkBtn" type="button" style="width:28px;height:28px;flex:0 0 auto" aria-label="Copy link"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button></div></div>
    <div class="field" style="margin-top:12px"><label>Details</label><p class="hint" id="previewDetails"></p></div>
    <div class="dialog-actions">
      <button class="button secondary" data-close-dialog="previewDialog" type="button">Close</button>
      <a class="button" id="openFileBtn" href="#" target="_blank" rel="noopener">Open file</a>
    </div>
  </dialog>

  <script type="module" src="/assets/js/library.js"></script>
</body>
</html>
